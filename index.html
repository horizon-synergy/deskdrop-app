<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Inter, referenced by --font-family-base in src/styles/global.css.
         The neobrutalist direction leans on heavy weights (700/800) for
         headings and buttons, so those weights are loaded explicitly —
         without them the browser would synthesise fake bold, which looks
         smeared at large display sizes. Falls back to the system font
         stack if this fails to load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>DeskDrop</title>
    <meta
      name="description"
      content="DeskDrop sources and stocks stationery from trusted suppliers, and ships it directly to you."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
